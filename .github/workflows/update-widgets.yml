name: 노션 위젯 자동 갱신

on:
  # 매일 UTC 14:00 = 한국시간 23:00 에 실행
  schedule:
    - cron: "0 14 * * *"
  # 깃허브 화면에서 수동으로도 돌릴 수 있게
  workflow_dispatch:

# 생성된 html을 저장소에 다시 커밋하려면 쓰기 권한이 필요
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul   # 날짜 계산을 한국 시간 기준으로

    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install requests python-dotenv

      - name: 히트맵 생성
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python generate_heatmap.py

      - name: 로그 생성
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python generate_log.py

      - name: 변경사항 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add heatmap.html log.html
          # 바뀐 게 없으면 커밋을 건너뛴다 (매일 빈 커밋이 쌓이는 것 방지)
          if git diff --staged --quiet; then
            echo "변경사항 없음 - 커밋 생략"
          else
            git commit -m "자동 갱신: $(date '+%Y-%m-%d %H:%M')"
            git push
          fi