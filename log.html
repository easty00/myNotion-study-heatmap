<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>study log</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    display: flex;
    justify-content: center;
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .card {
    width: 100%;
    max-width: 760px;
    min-width: 0;
    background: #ffffff;
    border: 1.5px solid #c4bee2;
    border-radius: 16px;
    padding: 18px 22px;
    box-sizing: border-box;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #6c5a72;
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 14px;
  }
  .header .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #9986b3;
  }
  .row {
    padding: 7px 0;
    border-bottom: 1px solid #ece8f2;
    font-size: 13px;
  }
  .row:last-child {
    border-bottom: none;
  }
  .row-top {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;   /* 자식이 넘칠 때 title이 줄임표로 잘리도록 허용 */
  }
  .row .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .row .date {
    color: #a39cae;
    font-family: "SFMono-Regular", Consolas, monospace;
    width: 38px;
    flex-shrink: 0;
  }
  .row .title {
    color: #3a3441;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: 11.5px;
    padding-left: 16px;
    margin-top: 2px;
  }
  .status-badge {
    font-weight: 600;
  }
  .dates {
    display: flex;
    gap: 8px;
    color: #b3abbf;
    font-family: "SFMono-Regular", Consolas, monospace;
  }
  .log-list {
    max-height: 252px;   /* 대략 7행 높이 */
    overflow-y: auto;
  }
  .log-list::-webkit-scrollbar {
    width: 6px;
  }
  .log-list::-webkit-scrollbar-thumb {
    background: #d9d1e8;
    border-radius: 3px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="header"><span class="dot"></span>학습 로그 정리 현황</div>
  <div class="log-list">
  
        <div class="row">
          <div class="row-top">
            <span class="dot" style="background:#6c5a72"></span>
            <span class="date">10.06</span>
            <span class="title">[LG CNS 7기] 0일차 TIL + 본인이 생각하는 오늘의 학습 키워드</span>
          </div>
          <div class="row-bottom">
            <span class="status-badge" style="color:#6c5a72">완료</span>
            <span class="dates">
              <span class="date-item">발행 10.06</span>
              <span class="date-item">수정 10.07</span>
            </span>
          </div>
        </div>
  </div>
</div>
</body>
</html>
